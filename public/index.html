<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>NAP Projects</title>
<style>
:root{--ink:#191919;--muted:#787774;--faint:#9b9a97;--line:#e9e9e7;--line2:#f1f1ef;--hover:#f5f5f4;
  --blue:#0b4a91;--bluebg:#dbeafe;--bluedot:#2f80ed;
  --green:#116631;--greenbg:#d7f3df;--greendot:#2ea043;
  --amber:#8a5c00;--amberbg:#fcecc4;--amberdot:#e0a020;
  --red:#9c1c14;--redbg:#fbdad7;--reddot:#e5484d;
  --gray:#787774;--graybg:#eeedec;--graydot:#9b9a97}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased;
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.top{max-width:1180px;margin:0 auto;padding:24px 24px 10px;display:flex;align-items:center;gap:10px}
.mark{font-size:20px}
.top .t{font-weight:700;font-size:15px}
.top .s{color:var(--faint);font-size:13px}
.top .sp{flex:1}
.top .who{display:flex;align-items:center;gap:16px;font-size:12.5px;color:var(--muted)}
.top .who a{color:var(--muted);text-decoration:none}
.top .who a:hover{color:var(--ink);text-decoration:underline}
main{max-width:1180px;margin:0 auto;padding:10px 24px 80px}
.toolbar{display:flex;align-items:center;gap:10px;margin:14px 0 22px}
.toolbar input[type=search]{flex:1;max-width:280px;padding:7px 10px;border:1px solid var(--line);
  border-radius:7px;font-size:13px;background:var(--hover)}
.btn{padding:7px 13px;border-radius:7px;border:1px solid var(--line);background:#fff;
  font-size:13px;font-weight:500;cursor:pointer;color:var(--ink)}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.pri:hover{background:#333}
.gopen{display:inline-flex;align-items:center;gap:8px;cursor:pointer;border-radius:6px;padding:2px 4px;margin:-2px -4px}
.gopen:hover{background:var(--line2)}
.gicon{font-size:16px}
.gcount{color:var(--faint);font-weight:500;font-size:12.5px}
.tablewrap{border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
thead tr{background:#fbfbfa}
th{text-align:left;font-weight:600;color:var(--faint);font-size:11px;text-transform:uppercase;
  letter-spacing:.04em;padding:9px 10px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap}
th:hover{color:var(--muted)}
td{padding:2px 8px;border-bottom:1px solid var(--line2);vertical-align:middle;height:40px}
tbody tr:last-child td{border-bottom:none}
tr.taskrow{cursor:pointer}
tr.taskrow:hover{background:var(--hover)}
td.name-cell{min-width:220px}
.name-wrap{display:flex;align-items:center;gap:2px}
.name-in{border:none;background:transparent;font-size:13.5px;font-weight:500;width:100%;
  padding:5px 4px;border-radius:5px;color:var(--ink)}
.name-in:hover,.name-in:focus{background:var(--hover);outline:none}

/* Chips/pills - alt er en knap der aabner et popover, aldrig et nøgent OS-kontrol */
.pillbtn{border:none;cursor:pointer;font-size:12px;font-weight:650;padding:4px 10px 4px 8px;border-radius:20px;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pillbtn:hover{filter:brightness(.96)}
.pillbtn.empty{background:transparent;color:var(--faint);font-weight:400;padding:4px 6px}
.pillbtn.empty:hover{background:var(--hover);border-radius:6px}
.dot{width:6px;height:6px;border-radius:50%;flex:none}
.personbtn{border:none;background:transparent;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  font-size:12.5px;color:var(--ink);padding:4px 6px;border-radius:6px;max-width:100%}
.personbtn:hover{background:var(--hover)}
.personbtn.empty{color:var(--faint)}
.avatar{width:20px;height:20px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700}
.avatar.sm{width:18px;height:18px;font-size:9.5px}
.datebtn{border:none;background:transparent;cursor:pointer;font-size:12.5px;color:var(--ink);
  padding:4px 7px;border-radius:6px}
.datebtn:hover{background:var(--hover)}
.datebtn.empty{color:var(--faint)}
.datebtn.overdue{color:var(--red);font-weight:600}
.datebtn.loebende{color:var(--blue);font-weight:600;background:var(--bluebg);border-radius:20px;padding:4px 10px}

.tagchip{display:inline-block;background:var(--graybg);color:var(--gray);border-radius:4px;
  padding:2px 7px;font-size:11px;font-weight:500;margin:1px 3px 1px 0}
.tagsbtn,.depsbtn{cursor:pointer;min-height:22px;display:flex;align-items:center;flex-wrap:wrap;padding:3px 4px;border-radius:6px}
.tagsbtn:hover,.depsbtn:hover{background:var(--hover)}
.depnames{font-size:12px;color:var(--muted)}
.addrow{color:var(--faint);cursor:pointer;padding:9px 10px;font-size:13px}
.addrow:hover{color:var(--muted);background:var(--hover)}

.popover{position:absolute;background:#fff;border:1px solid var(--line);border-radius:9px;
  box-shadow:0 10px 28px rgba(0,0,0,.14);padding:6px;z-index:100;min-width:190px;max-height:280px;overflow:auto}
.popitem{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13px}
.popitem:hover{background:var(--hover)}
.popitem.on{font-weight:650}
.popover input[type=date]{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:13px}
.popover input[type=text]{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 8px;
  font-size:12.5px;margin-top:4px}
.empty{color:var(--faint);padding:40px 4px;text-align:center;font-size:13.5px}

/* Task-/projekt-kort - centreret modal, "hver raekke er en side" */
.backdrop{position:fixed;inset:0;background:rgba(15,15,15,.28);z-index:90;
  opacity:0;pointer-events:none;transition:opacity .15s ease}
.backdrop.open{opacity:1;pointer-events:auto}
.panel{position:fixed;top:50%;left:50%;width:min(640px,92vw);max-height:86vh;background:#fff;z-index:95;
  border-radius:14px;box-shadow:0 28px 64px rgba(0,0,0,.24);
  transform:translate(-50%,-50%) scale(.97);opacity:0;pointer-events:none;
  transition:transform .14s cubic-bezier(.2,.8,.2,1),opacity .14s ease;
  display:flex;flex-direction:column}
.panel.open{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
.panel-head{flex:none;display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.panel-close{margin-left:auto;width:28px;height:28px;border:none;background:none;border-radius:6px;
  cursor:pointer;font-size:15px;color:var(--muted)}
.panel-close:hover{background:var(--hover)}
.panel-body{flex:1;min-height:0;overflow-y:auto;padding:8px 40px 40px}
.crumb{font-size:12.5px;color:var(--faint);margin-bottom:10px;display:flex;align-items:center;gap:5px}
.panel-icon{font-size:38px;margin-bottom:8px}
.panel-title{width:100%;border:none;font-size:26px;font-weight:700;letter-spacing:-.01em;
  padding:2px 4px;margin:0 0 18px -4px;border-radius:6px;color:var(--ink)}
.panel-title:hover,.panel-title:focus{background:var(--hover);outline:none}
.proprow{display:flex;align-items:center;min-height:34px;font-size:13.5px}
.proprow .lab{flex:none;width:120px;color:var(--faint);font-size:13px}
.proprow .val{flex:1;min-width:0}
.panel-divider{height:1px;background:var(--line);margin:18px 0}
.desclab{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);margin-bottom:8px}
.panel-desc{width:100%;min-height:180px;border:none;resize:vertical;font:14px/1.6 inherit;color:var(--ink);
  padding:4px;border-radius:6px}
.panel-desc:hover,.panel-desc:focus{background:var(--hover);outline:none}
.panel-desc::placeholder{color:var(--faint)}
.panel-desc-view{min-height:60px;padding:4px;border-radius:6px;cursor:text;line-height:1.6}
.panel-desc-view:hover{background:var(--hover)}
.panel-desc-view p{margin:0 0 8px}
.panel-desc-view ul{margin:0 0 8px;padding-left:20px}
.desc-placeholder{color:var(--faint)}

/* Sub-opgaver */
.sublab{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);margin:4px 0 6px}
.subcount{font-weight:500;text-transform:none;letter-spacing:0}
.sublist{margin-bottom:4px}
.subrow{display:flex;align-items:center;gap:9px;padding:6px 4px;border-radius:6px;font-size:13.5px}
.subrow:hover{background:var(--hover)}
.subrow.done .subname{color:var(--faint);text-decoration:line-through}
.subcheck{width:16px;height:16px;flex:none;cursor:pointer}
.subname{cursor:pointer;flex:1}
.subadd input{width:100%;border:none;background:transparent;font-size:13.5px;padding:6px 4px;border-radius:6px;color:var(--muted)}
.subadd input:hover,.subadd input:focus{background:var(--hover);outline:none;color:var(--ink)}

/* Filer */
.filerow{display:flex;align-items:center;gap:8px;padding:6px 4px;border-radius:6px;font-size:13.5px}
.filerow:hover{background:var(--hover)}
.filelink{color:var(--ink);text-decoration:none;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filelink:hover{text-decoration:underline}
.filesize{color:var(--faint);font-size:12px;flex:none}
.filedel{border:none;background:none;color:var(--faint);cursor:pointer;font-size:15px;flex:none;
  width:22px;height:22px;border-radius:5px;opacity:0}
.filerow:hover .filedel{opacity:1}
.filedel:hover{background:var(--line);color:var(--ink)}
.filebtn{display:inline-block;cursor:pointer;color:var(--muted);font-size:13px;padding:5px 4px;border-radius:6px}
.filebtn:hover{background:var(--hover);color:var(--ink)}

/* Kommentarer */
.commentlist{margin-bottom:10px}
.comment{display:flex;gap:9px;padding:8px 2px}
.chead{font-size:12.5px;margin-bottom:2px}
.chead b{font-weight:650}
.ctime{color:var(--faint);margin-left:5px}
.ctext{font-size:13.5px;line-height:1.5;white-space:pre-wrap}
.commentadd{display:flex;gap:8px;align-items:flex-start;margin-top:6px}
.commentadd textarea{flex:1;border:1px solid var(--line);border-radius:7px;padding:8px 10px;font:13.5px/1.5 inherit;
  resize:none;min-height:36px;color:var(--ink)}
.commentadd textarea:focus{outline:none;border-color:var(--faint)}

/* View-toggle og board */
.viewtabs{display:inline-flex;background:var(--hover);border-radius:7px;padding:2px;gap:2px}
.viewtab{border:none;background:none;padding:5px 12px;font-size:12.5px;font-weight:500;border-radius:5px;
  cursor:pointer;color:var(--muted)}
.viewtab.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.board{display:flex;gap:14px;align-items:flex-start;overflow-x:auto;padding-bottom:8px}
.boardcol{flex:none;width:270px;background:#fbfbfa;border:1px solid var(--line);border-radius:9px;padding:10px}
.boardhead{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:650;margin-bottom:8px;padding:2px 4px}
.boardcards{display:flex;flex-direction:column;gap:8px;min-height:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 11px;cursor:pointer}
.card:hover{border-color:var(--faint);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.cardname{font-size:13.5px;font-weight:500;margin-bottom:8px}
.cardmeta{display:flex;align-items:center;gap:2px;flex-wrap:wrap}

/* Landingsside: "Mine projektmapper" */
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:8px}
.foldercard{position:relative;background:#fff;border:1px solid var(--line);border-radius:11px;padding:20px;
  cursor:pointer;text-align:left;transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease}
.foldercard:hover{border-color:var(--faint);box-shadow:0 4px 14px rgba(0,0,0,.06);transform:translateY(-1px)}
.foldericon{font-size:30px;margin-bottom:10px}
.foldername{font-weight:650;font-size:14.5px;margin-bottom:4px}
.folderstat{color:var(--faint);font-size:12.5px}
.foldercard .delprojbtn{position:absolute;top:10px;right:10px;width:26px;height:26px;border:none;background:none;
  color:var(--faint);cursor:pointer;border-radius:6px;font-size:13px;opacity:0}
.foldercard:hover .delprojbtn{opacity:1}
.foldercard .delprojbtn:hover{background:var(--redbg);color:var(--red)}

/* Header naar man er inde i ét projekt */
.projhead{display:flex;align-items:center;gap:10px;margin:6px 0 14px}
.projhead .gopen{font-weight:650;font-size:16px}
</style>
</head>
<body>
<div class="top">
  <span class="mark">🗂️</span><span class="t">NAP</span><span class="s">Projekter</span>
  <div class="sp"></div>
  <div class="who" id="who"></div>
</div>
<main>
  <div class="toolbar">
    <button class="btn" id="backToFolders" style="display:none">← Alle mapper</button>
    <input type="search" id="search" placeholder="Søg i opgaver…" style="display:none">
    <div class="viewtabs" id="viewtabsWrap" style="display:none">
      <button class="viewtab on" id="viewTable">Tabel</button>
      <button class="viewtab" id="viewBoard">Tavle</button>
    </div>
    <div class="sp"></div>
    <button class="btn" id="newProject">+ Nyt projekt</button>
  </div>
  <div id="groups"></div>
</main>

<div class="backdrop" id="backdrop"></div>
<aside class="panel" id="panel">
  <div class="panel-head"><button class="panel-close" id="panelClose">✕</button></div>
  <div class="panel-body">
    <div class="crumb" id="panelCrumb"></div>
    <div class="panel-icon">📄</div>
    <input class="panel-title" id="panelTitle" placeholder="Uden navn">
    <div id="panelProps"></div>
    <div class="panel-divider"></div>
    <div class="desclab">Noter</div>
    <div class="panel-desc-view" id="panelDescView"></div>
    <textarea class="panel-desc" id="panelDesc" placeholder="Skriv beskrivelse, kontekst eller noter til opgaven… (understøtter **fed**, *kursiv* og &quot;- &quot; for punktliste)" style="display:none"></textarea>
    <div class="panel-divider"></div>
    <div class="sublab">Sub-opgaver</div>
    <div id="panelSubtasks"></div>
    <div class="panel-divider"></div>
    <div class="desclab">Filer</div>
    <div id="panelFiles"></div>
    <label class="filebtn">+ Vedhæft fil<input type="file" id="fileInput" style="display:none"></label>
    <div class="panel-divider"></div>
    <div class="desclab">Kommentarer</div>
    <div class="commentlist" id="panelComments"></div>
    <div class="commentadd">
      <textarea id="commentInput" placeholder="Skriv en kommentar… (Enter for at sende)"></textarea>
    </div>
  </div>
</aside>

<aside class="panel" id="projectPanel">
  <div class="panel-head"><button class="panel-close" id="projectPanelClose">✕</button></div>
  <div class="panel-body">
    <div class="panel-icon" id="ppIcon">📁</div>
    <input class="panel-title" id="ppTitle" placeholder="Uden navn">
    <div id="ppProps"></div>
    <div class="panel-divider"></div>
    <div class="desclab">Noter</div>
    <div class="panel-desc-view" id="ppDescView"></div>
    <textarea class="panel-desc" id="ppDesc" placeholder="Skriv noter, kontekst eller status til projektet…" style="display:none"></textarea>
  </div>
</aside>

<script>
let STATE = { projects:[], tasks:[], users:[], tags:[] };
let sortKey = null, sortDir = 1, filterText = '';
let openTaskId = null;
let openProjectId = null;
const EFFORTS = ['Small','Medium','Large'];
const EFFORT_LABEL = { 'Small':'Lille', 'Medium':'Mellem', 'Large':'Stor' };
let viewMode = 'table';
let panelComments = [];
let panelFiles = [];
let currentProjectId = null;

const STATUSES = ['Not started','In progress','Done'];
const PRIOS = ['Low','Medium','High'];
const STATUS_LABEL = { 'Not started':'Ikke startet', 'In progress':'I gang', 'Done':'Færdig' };
const PRIO_LABEL = { 'Low':'Lav', 'Medium':'Mellem', 'High':'Høj' };
const DUE_LOEBENDE = 'løbende';
const META = {
  status: {
    'Not started': { bg:'var(--graybg)', fg:'var(--gray)', dot:'var(--graydot)' },
    'In progress': { bg:'var(--bluebg)', fg:'var(--blue)', dot:'var(--bluedot)' },
    'Done':        { bg:'var(--greenbg)', fg:'var(--green)', dot:'var(--greendot)' },
  },
  priority: {
    'Low':    { bg:'var(--graybg)', fg:'var(--gray)', dot:'var(--graydot)' },
    'Medium': { bg:'var(--amberbg)', fg:'var(--amber)', dot:'var(--amberdot)' },
    'High':   { bg:'var(--redbg)', fg:'var(--red)', dot:'var(--reddot)' },
  },
};
const AVATAR_PALETTE = [
  { bg:'#dbeafe', fg:'#0b4a91' }, { bg:'#fbdad7', fg:'#9c1c14' }, { bg:'#d7f3df', fg:'#116631' },
  { bg:'#fcecc4', fg:'#8a5c00' }, { bg:'#e7ddfb', fg:'#5a3ea6' }, { bg:'#fbdcee', fg:'#a3236f' },
];
const MONTHS = ['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'];

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function avatarColor(name){ let h=0; for(const c of name) h=(h*31+c.charCodeAt(0))>>>0; return AVATAR_PALETTE[h % AVATAR_PALETTE.length]; }
function formatDate(iso){
  if(!iso) return '';
  if(iso === DUE_LOEBENDE) return 'Løbende';
  const [y,m,d] = iso.split('-').map(Number);
  return d + '. ' + MONTHS[m-1];
}
function isOverdue(iso, status){
  if(!iso || iso === DUE_LOEBENDE || status === 'Done') return false;
  return iso < new Date().toISOString().slice(0,10);
}
function relTime(iso){
  if(!iso) return '';
  const d = new Date(iso.replace(' ','T') + 'Z');
  const mins = Math.round((Date.now() - d.getTime())/60000);
  if(mins < 1) return 'lige nu';
  if(mins < 60) return mins + ' min siden';
  const hrs = Math.round(mins/60);
  if(hrs < 24) return hrs + ' t siden';
  return Math.round(hrs/24) + ' d siden';
}
function renderMarkdownLite(text){
  if(!text) return '';
  let html = esc(text);
  html = html.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  html = html.replace(/(^|[^*])\*([^*\n]+?)\*(?!\*)/g, '$1<i>$2</i>');
  const lines = html.split('\n');
  let out = [], inList = false;
  for(const line of lines){
    if(/^\s*-\s+/.test(line)){
      if(!inList){ out.push('<ul>'); inList = true; }
      out.push('<li>' + line.replace(/^\s*-\s+/, '') + '</li>');
    } else {
      if(inList){ out.push('</ul>'); inList = false; }
      if(line.trim()) out.push('<p>' + line + '</p>');
    }
  }
  if(inList) out.push('</ul>');
  return out.join('');
}

async function api(path, opts){
  const r = await fetch(path, { headers:{'content-type':'application/json'}, ...opts });
  if(r.status === 401){ location.href = '/login'; throw new Error('ikke logget ind'); }
  if(!r.ok) throw new Error('API-fejl ' + r.status);
  return r.status === 204 ? null : r.json();
}

async function loadAll(){
  const [me, all] = await Promise.all([ api('/api/me'), api('/api/all') ]);
  STATE = all;
  document.getElementById('who').innerHTML =
    '<span>' + esc(me.username) + '</span>' +
    (me.isAdmin ? '<a href="/admin/users">Administrer brugere</a>' : '') +
    '<a href="/account/password">Skift adgangskode</a>' +
    '<a href="/logout">Log ud</a>';
  render();
  if(openTaskId != null) renderPanel(openTaskId);
  if(openProjectId != null) renderProjectPanel(openProjectId);
}

function userName(id){ const u = STATE.users.find(u=>u.id===id); return u ? u.username : ''; }
function taskName(id){ const t = STATE.tasks.find(t=>t.id===id); return t ? t.name : '?'; }
function tagName(id){ const t = STATE.tags.find(t=>t.id===id); return t ? t.name : ''; }
function projectOf(t){ return STATE.projects.find(p => p.id === t.project_id); }

function matchesFilter(t){
  if(!filterText) return true;
  const hay = [t.name, userName(t.assignee_id), ...(t.tags||[]).map(tagName)].join(' ').toLowerCase();
  return hay.includes(filterText.toLowerCase());
}

function sortTasks(list){
  if(!sortKey) return list;
  return [...list].sort((a,b)=>{
    let av = a[sortKey], bv = b[sortKey];
    if(sortKey === 'assignee_id'){ av = userName(av); bv = userName(bv); }
    av = av==null?'':av; bv = bv==null?'':bv;
    return av < bv ? -sortDir : av > bv ? sortDir : 0;
  });
}

/* ---- Genbrugte byggeklodser: pille/person/dato-knapper ---- */

function pillBtn(kind, taskId, value){
  const m = kind==='status' ? META.status[value||'Not started'] : (value ? META.priority[value] : null);
  if(!m) return '<button class="pillbtn empty" data-id="'+taskId+'" data-kind="'+kind+'">–</button>';
  const label = kind==='status' ? STATUS_LABEL[value||'Not started'] : PRIO_LABEL[value];
  return '<button class="pillbtn" data-id="'+taskId+'" data-kind="'+kind+'" style="background:'+m.bg+';color:'+m.fg+'">'+
    '<span class="dot" style="background:'+m.dot+'"></span>'+esc(label)+'</button>';
}
function personBtn(taskId, userId){
  const u = STATE.users.find(x=>x.id===userId);
  if(!u) return '<button class="personbtn empty" data-id="'+taskId+'">+ Tilføj</button>';
  const c = avatarColor(u.username);
  return '<button class="personbtn" data-id="'+taskId+'">'+
    '<span class="avatar" style="background:'+c.bg+';color:'+c.fg+'">'+esc(u.username[0].toUpperCase())+'</span>'+
    esc(u.username)+'</button>';
}
function dateBtn(taskId, iso, status){
  if(!iso) return '<button class="datebtn empty" data-id="'+taskId+'">+ Dato</button>';
  const cls = iso===DUE_LOEBENDE ? ' loebende' : (isOverdue(iso,status) ? ' overdue' : '');
  return '<button class="datebtn'+cls+'" data-id="'+taskId+'">'+esc(formatDate(iso))+'</button>';
}

function bindCellControls(root){
  root.querySelectorAll('.pillbtn').forEach(b => b.onclick = e => openPillPopover(e, Number(b.dataset.id), b.dataset.kind));

  root.querySelectorAll('.datebtn').forEach(b => b.onclick = e => openDatePopover(e, Number(b.dataset.id)));

  root.querySelectorAll('.depsbtn').forEach(el => el.onclick = e => openDepsPopover(e, Number(el.dataset.id)));
}

function updateToolbar(){
  const inProject = currentProjectId != null;
  document.getElementById('backToFolders').style.display = inProject ? 'inline-block' : 'none';
  document.getElementById('search').style.display = inProject ? 'block' : 'none';
  document.getElementById('viewtabsWrap').style.display = inProject ? 'inline-flex' : 'none';
}

function render(){
  const wrap = document.getElementById('groups');
  updateToolbar();
  if(!STATE.projects.length){
    wrap.innerHTML = '<div class="empty">Ingen projektmapper endnu — opret den første med "+ Nyt projekt".</div>';
    return;
  }
  if(currentProjectId == null) return renderLanding();
  const p = STATE.projects.find(x => x.id === currentProjectId);
  if(!p){ currentProjectId = null; return render(); }
  if(viewMode === 'board') return renderBoard(p);

  const tasks = sortTasks(STATE.tasks.filter(t => t.project_id === p.id && !t.parent_task_id && matchesFilter(t)));
  wrap.innerHTML =
    '<div class="projhead">' +
      '<span class="gopen" data-pid="' + p.id + '" title="Åbn projektnoter"><span class="gicon">' + esc(p.icon||'📁') + '</span>' + esc(p.name) + '</span>' +
      '<span class="gcount">' + tasks.length + '</span>' +
    '</div>' +
    renderTable(p, tasks);

  wrap.querySelectorAll('.gopen').forEach(el => el.onclick = () => openProjectPanel(Number(el.dataset.pid)));
  wrap.querySelectorAll('[data-th]').forEach(th => th.onclick = () => {
    const k = th.dataset.th;
    sortDir = (sortKey === k) ? -sortDir : 1;
    sortKey = k;
    render();
  });
  wrap.querySelectorAll('.name-in').forEach(inp => {
    inp.onclick = e => e.stopPropagation();
    inp.onblur = () => saveTask(Number(inp.dataset.id), { name: inp.value.trim() || 'Uden navn' });

function renderLanding(){
  const wrap = document.getElementById('groups');
  wrap.innerHTML = '<div class="folders">' + STATE.projects.map(p => {
    const count = STATE.tasks.filter(t => t.project_id === p.id && !t.parent_task_id).length;
    return '<div class="foldercard" data-pid="' + p.id + '">' +

/* ---- Popovers ---- */

function closePopover(){ document.querySelectorAll('.popover').forEach(p => p.remove()); }
function placePopover(pop, e){
  pop.style.position = 'absolute';
  document.body.appendChild(pop);
  let x = e.pageX, y = e.pageY;
  const vw = window.innerWidth + window.scrollX;
  if(x + pop.offsetWidth > vw - 10) x = vw - pop.offsetWidth - 10;
  pop.style.left = x + 'px'; pop.style.top = y + 'px';
}

function openPillPopover(e, taskId, kind){
  e.stopPropagation(); closePopover();
  const t = STATE.tasks.find(x=>x.id===taskId);
  const current = kind==='status' ? (t.status||'Not started') : t.priority;
  const options = kind==='status' ? STATUSES : PRIOS;
  const meta = META[kind];
  const pop = document.createElement('div');
  pop.className = 'popover';
  let html = kind==='priority'
    ? '<div class="popitem' + (!current?' on':'') + '" data-v=""><span class="dot" style="background:var(--graydot)"></span>Ingen</div>'
    : '';
  const labels = kind==='status' ? STATUS_LABEL : PRIO_LABEL;
  html += options.map(o => '<div class="popitem' + (o===current?' on':'') + '" data-v="' + o + '">' +
    '<span class="dot" style="background:' + meta[o].dot + '"></span>' + labels[o] + '</div>').join('');
  pop.innerHTML = html;
  placePopover(pop, e);
  pop.querySelectorAll('.popitem').forEach(item => item.onclick = () => {
    const v = item.dataset.v;
    saveTask(taskId, kind==='status' ? { status: v } : { priority: v || null });
    closePopover();
  });
}

function openPersonPopover(e, taskId){
  e.stopPropagation(); closePopover();
  const t = STATE.tasks.find(x=>x.id===taskId);
  const pop = document.createElement('div');
  pop.className = 'popover';
  let html = '<div class="popitem' + (!t.assignee_id?' on':'') + '" data-v=""><span class="avatar sm" style="background:var(--graybg);color:var(--faint)">–</span>Ingen</div>';
  html += STATE.users.map(u => {
    const c = avatarColor(u.username);
    return '<div class="popitem' + (u.id===t.assignee_id?' on':'') + '" data-v="' + u.id + '">' +
      '<span class="avatar sm" style="background:' + c.bg + ';color:' + c.fg + '">' + esc(u.username[0].toUpperCase()) + '</span>' +
      esc(u.username) + '</div>';
  }).join('');
  pop.innerHTML = html;
  placePopover(pop, e);
  pop.querySelectorAll('.popitem').forEach(item => item.onclick = () => {
    const v = item.dataset.v;
    saveTask(taskId, { assignee_id: v ? Number(v) : null });
    closePopover();
  });
}

function openDatePopover(e, taskId){
  e.stopPropagation(); closePopover();
  const t = STATE.tasks.find(x=>x.id===taskId);
  const isLoebende = t.due_date === DUE_LOEBENDE;
  const pop = document.createElement('div');
  pop.className = 'popover';
  pop.innerHTML = '<input type="date" value="' + (isLoebende ? '' : (t.due_date||'')) + '">' +
    '<div class="popitem' + (isLoebende?' on':'') + ' loebende"><span class="dot" style="background:var(--bluedot)"></span>Løbende opgave</div>' +
    (t.due_date ? '<div class="popitem clear">Fjern dato</div>' : '');
  placePopover(pop, e);
  const inp = pop.querySelector('input');
  inp.focus();
  inp.onchange = () => { saveTask(taskId, { due_date: inp.value || null }); closePopover(); };
  pop.querySelector('.loebende').onclick = () => { saveTask(taskId, { due_date: DUE_LOEBENDE }); closePopover(); };
  const clr = pop.querySelector('.clear');
  if(clr) clr.onclick = () => { saveTask(taskId, { due_date: null }); closePopover(); };
}

function openTagsPopover(e, taskId){
  e.stopPropagation(); closePopover();
  const t = STATE.tasks.find(t=>t.id===taskId);
  const mine = new Set(t.tags||[]);
  const pop = document.createElement('div');
  pop.className = 'popover';
  pop.innerHTML = STATE.tags.map(tag =>
    '<label class="popitem"><input type="checkbox" value="' + tag.id + '"' + (mine.has(tag.id)?' checked':'') + '>' + esc(tag.name) + '</label>').join('') +
    '<input type="text" placeholder="Ny tag + Enter">';
  placePopover(pop, e);
  pop.querySelectorAll('input[type=checkbox]').forEach(cb => cb.onchange = async () => {
    const ids = [...pop.querySelectorAll('input[type=checkbox]:checked')].map(x=>Number(x.value));
    await saveTask(taskId, { tags: ids });
  });
  const txt = pop.querySelector('input[type=text]');
  txt.onkeydown = async e2 => {
    if(e2.key === 'Enter' && txt.value.trim()){
      const r = await api('/api/tags', { method:'POST', body: JSON.stringify({ name: txt.value.trim() }) });
      await loadAll();
      const ids = [...(STATE.tasks.find(t=>t.id===taskId).tags||[]), r.id];
      await saveTask(taskId, { tags: ids });
      closePopover();
    }
  };
}

function openDepsPopover(e, taskId){
  e.stopPropagation(); closePopover();
  const t = STATE.tasks.find(t=>t.id===taskId);
  const mine = new Set(t.blocked_by||[]);
  const others = STATE.tasks.filter(x => x.project_id === t.project_id && x.id !== taskId);
  const pop = document.createElement('div');
  pop.className = 'popover';
  pop.innerHTML = others.length
    ? others.map(o => '<label class="popitem"><input type="checkbox" value="' + o.id + '"' + (mine.has(o.id)?' checked':'') + '>' + esc(o.name) + '</label>').join('')
    : '<div class="depnames" style="padding:6px">Ingen andre opgaver i projektet</div>';
  placePopover(pop, e);
  pop.querySelectorAll('input[type=checkbox]').forEach(cb => cb.onchange = async () => {
    const ids = [...pop.querySelectorAll('input[type=checkbox]:checked')].map(x=>Number(x.value));
    await saveTask(taskId, { blocked_by: ids });
  });
}

document.addEventListener('click', closePopover);

/* ---- Filer ---- */

function humanSize(bytes){
  if(bytes == null) return '';
  if(bytes < 1024) return bytes + ' B';
  if(bytes < 1024*1024) return Math.round(bytes/1024) + ' KB';
  return (bytes/1024/1024).toFixed(1) + ' MB';
}
async function loadFiles(taskId){
  panelFiles = await api('/api/tasks/' + taskId + '/attachments');
  renderFiles();
}
function renderFiles(){
  const el = document.getElementById('panelFiles');
  el.innerHTML = panelFiles.map(f =>
    '<div class="filerow">' +
      '<a class="filelink" href="/api/attachments/' + f.id + '/download">📎 ' + esc(f.filename) + '</a>' +
      '<span class="filesize">' + humanSize(f.size) + '</span>' +
      '<button class="filedel" data-id="' + f.id + '" title="Fjern fil">×</button>' +
    '</div>'
  ).join('') || '<div class="depnames">Ingen filer endnu</div>';
  el.querySelectorAll('.filedel').forEach(b => b.onclick = async () => {
    await api('/api/attachments/' + b.dataset.id, { method:'DELETE' });
    await loadFiles(openTaskId);
  });
}
document.getElementById('fileInput').onchange = async e => {
  const file = e.target.files[0];
  if(!file || openTaskId == null) return;
  const fd = new FormData();
  fd.append('file', file);
  const r = await fetch('/api/tasks/' + openTaskId + '/attachments', { method:'POST', body: fd });
  if(r.status === 401){ location.href = '/login'; return; }
  e.target.value = '';
  await loadFiles(openTaskId);
};

/* ---- Kommentarer ---- */

async function loadComments(taskId){
  panelComments = await api('/api/tasks/' + taskId + '/comments');
  renderComments();
}
function renderComments(){
  const el = document.getElementById('panelComments');
  el.innerHTML = panelComments.map(c => {
    const uname = userName(c.user_id) || '?';
    const col = avatarColor(uname);
    return '<div class="comment">' +
      '<span class="avatar" style="background:' + col.bg + ';color:' + col.fg + '">' + esc(uname[0].toUpperCase()) + '</span>' +
      '<div><div class="chead"><b>' + esc(uname) + '</b><span class="ctime">' + relTime(c.created_at) + '</span></div>' +
      '<div class="ctext">' + esc(c.body) + '</div></div></div>';
  }).join('') || '<div class="depnames">Ingen kommentarer endnu</div>';
}
document.getElementById('commentInput').onkeydown = async e => {
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    const val = e.target.value.trim();
    if(!val || openTaskId == null) return;
    e.target.value = '';
    await api('/api/tasks/' + openTaskId + '/comments', { method:'POST', body: JSON.stringify({ body: val }) });
    await loadComments(openTaskId);
  }
};

async function saveTask(id, patch){
  await api('/api/tasks/' + id, { method:'PATCH', body: JSON.stringify(patch) });
  await loadAll();
}

async function addTask(projectId){
  const r = await api('/api/tasks', { method:'POST', body: JSON.stringify({ project_id: projectId, name:'Ny opgave' }) });
  await loadAll();
  const inp = document.querySelector('input.name-in[data-id="' + r.id + '"]');
  if(inp){ inp.focus(); inp.select(); }
}

document.getElementById('newProject').onclick = async () => {
  const name = prompt('Projektnavn:');
  if(!name) return;
  await api('/api/projects', { method:'POST', body: JSON.stringify({ name }) });
  await loadAll();
};

document.getElementById('search').oninput = e => { filterText = e.target.value; render(); };

loadAll().catch(err => {
  document.getElementById('groups').innerHTML = '<div class="empty">' + esc(err.message) + '</div>';
});
</script>
</body>
